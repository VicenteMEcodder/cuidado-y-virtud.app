<!DOCTYPE html>
<html lang="es-CL">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tu Cuidado - Check-in Diario</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=Nunito:wght@600;700;800;900&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Nunito', 'Plus Jakarta Sans', sans-serif;
      background-color: #F4F8FC;
      color: #0F3D6E;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }
    .pulse-ring {
      animation: pulse-waves 2.4s cubic-bezier(0.4, 0, 0.6, 1) infinite;
    }
    @keyframes pulse-waves {
      0%, 100% { transform: scale(1); opacity: 0.25; }
      50% { transform: scale(1.18); opacity: 0.6; }
    }
  </style>
</head>
<body class="min-h-screen h-screen flex flex-col justify-between p-6 overflow-hidden">
  
  <!-- Header sutil con logo e identidad -->
  <header class="flex items-center justify-between pt-2">
    <div class="flex items-center gap-3">
      <img src="https://lh3.googleusercontent.com/aida-public/AB6AXuAFVb5Haoy_x_vn5NDO8sGWRN1-m5XczYRkRuf88Vq0cAiP0376EDl5t3bUn6q0xShwBakQmxB3OSIOs7mlWf0kFatT2mdo03dvZ3J5xw15s9ntdYnGNpmKmBNg07Lij6X-S7r_gV9DxqXpsyy93x4q_2GYndHX6dfqe6vXhPyc-vpYLJBGwGCMzd1aCBOpeIljwQ8FUEo89SQtbD7NP9S3UhjkJDU4uNg240EdfHE2v3tAjjDW5FMjjw" alt="Tu Cuidado" class="h-12 w-auto object-contain">
      <span class="text-xl font-black text-[#0F3D6E] tracking-tight">Tu Cuidado</span>
    </div>
    <span class="inline-flex items-center px-4 py-1.5 rounded-full bg-[#E3EEF7] text-[#0F3D6E] font-bold text-sm">
      Hoy es Martes
    </span>
  </header>

  <!-- Contenido Central: Saludo y Pregunta grande (Sin scroll, alta legibilidad) -->
  <main class="flex flex-col items-center text-center my-auto px-2">
    <p class="text-[32px] font-bold text-[#3B8DBF] leading-tight mb-2">
      Buenos días, don Luis
    </p>
    <h1 class="text-[40px] font-black text-[#0F3D6E] leading-tight tracking-tight mb-7">
      ¿Cómo amaneció hoy?
    </h1>

    <!-- Botón principal de voz con ondas suaves -->
    <div class="relative flex items-center justify-center mb-8">
      <div class="absolute w-44 h-44 rounded-full bg-[#6FA0C8] pulse-ring"></div>
      <div class="absolute w-36 h-36 rounded-full bg-[#3B8DBF]/20"></div>
      <button class="relative w-32 h-32 rounded-full bg-[#0F3D6E] text-white flex flex-col items-center justify-center shadow-2xl shadow-[#0F3D6E]/40 active:scale-95 transition-transform border-4 border-white">
        <svg class="w-12 h-12 mb-1" fill="none" stroke="currentColor" stroke-width="2.5" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" d="M19 11a7 7 0 01-7 7m0 0a7 7 0 01-7-7m7 7v4m0 0H8m4 0h4m-4-8a3 3 0 01-3-3V5a3 3 0 116 0v6a3 3 0 01-3 3z"/>
        </svg>
        <span class="text-base font-extrabold tracking-wide uppercase">Hable aquí</span>
      </button>
    </div>

    <!-- 3 Botones grandes de respaldo táctil -->
    <div class="w-full flex flex-col gap-3.5 max-w-sm">
      <button class="w-full py-4 px-6 rounded-2xl bg-white border-2 border-[#3B8DBF]/40 hover:border-[#3B8DBF] text-[#0F3D6E] text-[30px] font-extrabold flex items-center justify-center gap-4 shadow-sm active:bg-blue-50 transition-all">
        <span class="text-4xl">😊</span>
        <span>Bien</span>
      </button>
      
      <button class="w-full py-4 px-6 rounded-2xl bg-white border-2 border-[#3B8DBF]/40 hover:border-[#3B8DBF] text-[#0F3D6E] text-[30px] font-extrabold flex items-center justify-center gap-4 shadow-sm active:bg-blue-50 transition-all">
        <span class="text-4xl">😐</span>
        <span>Más o menos</span>
      </button>

      <button class="w-full py-4 px-6 rounded-2xl bg-white border-2 border-[#3B8DBF]/40 hover:border-[#3B8DBF] text-[#0F3D6E] text-[30px] font-extrabold flex items-center justify-center gap-4 shadow-sm active:bg-blue-50 transition-all">
        <span class="text-4xl">😟</span>
        <span>Mal</span>
      </button>
    </div>

    <!-- Enlace tranquilo para no obligar -->
    <button class="mt-4 text-[#3B8DBF] font-bold text-[22px] underline underline-offset-8 active:text-[#0F3D6E] transition-colors py-2">
      Prefiero no responder
    </button>
  </main>

  <!-- Botón SOS destacado accesible fijo abajo -->
  <footer class="pt-2 pb-1">
    <button class="w-full py-5 rounded-2xl bg-[#E85D04] text-white text-[28px] font-black flex items-center justify-center gap-3 shadow-lg shadow-[#E85D04]/30 active:scale-[0.98] transition-transform">
      <span class="text-3xl">🆘</span>
      <span>Necesito ayuda ahora</span>
    </button>
    <p class="text-center text-xs font-semibold text-[#0F3D6E]/70 mt-2">
      Avisa de inmediato a una persona real de la Oficina del Adulto Mayor
    </p>
  </footer>

</body>
</html>
